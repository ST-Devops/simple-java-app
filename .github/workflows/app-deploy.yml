name: app-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/deploy-lambda.ps1"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and test
        working-directory: app
        run: mvn clean test package
      - name: Deploy Lambda version and update alias
        shell: pwsh
        run: ./scripts/deploy-lambda.ps1 -FunctionName "${{ vars.LAMBDA_FUNCTION_NAME }}" -ArtifactPath "app/target/serverless-java-api.jar"
